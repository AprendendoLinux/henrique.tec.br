services:
  app:
    build: .
    image: henriquetec:latest
    container_name: app
    hostname: app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=henrique
      - DB_PASSWORD=senha_segura
      - DB_NAME=henrique
      # Demais configurações (SMTP, Telegram, reCAPTCHA, rede/segurança) ficam no painel admin.
      # DB_PASSWORD também protege os segredos salvos no banco: trocá-la exige reconfigurá-los.
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: db
    hostname: db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "senha_de_root"
      MYSQL_DATABASE: henrique
      MYSQL_USER: henrique
      MYSQL_PASSWORD: "senha_segura"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
