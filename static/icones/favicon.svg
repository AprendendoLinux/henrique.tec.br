<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ícone do site henrique.tec.br: prompt de terminal ">_" neon sobre fundo escuro (mesma identidade do logo). -->
  <defs>
    <linearGradient id="borda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ffcc"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="brilho" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#00ffcc" stop-opacity=".18"/>
      <stop offset="1" stop-color="#00ffcc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="#070707"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#brilho)"/>
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="url(#borda)" stroke-width="12" stroke-opacity=".9"/>
  <!-- ">" -->
  <path d="M132 156 L252 256 L132 356" fill="none" stroke="#00ffcc" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- "_" (cursor) -->
  <rect x="282" y="322" width="134" height="56" rx="14" fill="#00ffcc"/>
</svg>
